[project]
name = "game-trainer"
version = "0.0.1"
description = "Local-first educational poker simulator and strategy trainer"
requires-python = ">=3.11"
dependencies = [
  "eval7==0.1.10",
  "jsonschema==4.17.3",
  "numpy==1.24.3",
  "termcolor>=2,<4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

